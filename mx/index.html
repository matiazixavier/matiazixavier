<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <!-- =====================================================
       01. CONFIGURAÇÕES BÁSICAS
       ===================================================== -->

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >


  <!-- =====================================================
       02. REDIRECIONAMENTO
       -----------------------------------------------------
       Redireciona a antiga rota /mx/ para a página
       principal atual do portfólio.
       ===================================================== -->

  <meta
    http-equiv="refresh"
    content="0; url=https://matiazixavier.com.br/"
  >


  <!-- =====================================================
       03. SEO
       -----------------------------------------------------
       Indica aos mecanismos de busca que esta página antiga
       não deve ser indexada e que a URL canônica é a raiz.
       ===================================================== -->

  <meta
    name="robots"
    content="noindex, follow"
  >

  <link
    rel="canonical"
    href="https://matiazixavier.com.br/"
  >


  <!-- =====================================================
       04. TÍTULO
       ===================================================== -->

  <title>Redirecionando | Caroline Matiazi Xavier</title>

</head>


<body>

  <!-- =====================================================
       05. CONTEÚDO DE FALLBACK
       -----------------------------------------------------
       Exibido caso o navegador não execute o redirecionamento
       automático.
       ===================================================== -->

  <p>
    Esta página foi movida.
    <a href="https://matiazixavier.com.br/">
      Acesse o portfólio atual de Caroline Matiazi Xavier.
    </a>
  </p>

</body>

</html>
